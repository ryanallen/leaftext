<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http://leaf-image.local leaf-image: data:; script-src 'self' 'unsafe-inline' http://leaf-asset.local leaf-asset:; style-src 'self' 'unsafe-inline' http://leaf-asset.local leaf-asset: https://fonts.googleapis.com; font-src 'self' data: http://leaf-asset.local leaf-asset: https://fonts.gstatic.com; connect-src 'self' http://leaf-source.local leaf-source: https://api.github.com">
<title>Leaftext</title>
<script>{{THEME_BOOTSTRAP_SCRIPT}}</script>
<link rel="stylesheet" href="{{KATEX_CSS_URL}}">
<link rel="stylesheet" href="{{APP_CSS_URL}}">
</head>
<body>
<header id="appBar" class="app-bar">
  <div class="app-bar-lead">
    <button type="button" id="homeButton" class="brand-button" aria-label="Home" title="Home">
      {{LEAF_ICON_SVG}}
    </button>
    <button type="button" id="libraryOpen" class="icon-button library-open" title="Toggle library" aria-label="Toggle library">{{OPEN_LIBRARY_ICON_SVG}}</button>
    <nav class="history-actions" aria-label="Document history">
      <button type="button" id="backButton" class="icon-button history-button" aria-label="Back" title="Back" disabled>
        {{BACK_ICON_SVG}}
      </button>
      <button type="button" id="forwardButton" class="icon-button history-button" aria-label="Forward" title="Forward" disabled>
        {{FORWARD_ICON_SVG}}
      </button>
    </nav>
  </div>
  <div class="tab-bar" id="tabBar" role="tablist" aria-label="Open documents"></div>
  <div class="app-trailing">
    <button type="button" id="overflowToggle" class="icon-button overflow-toggle" aria-haspopup="true" aria-expanded="false" aria-label="More options" title="More options"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg></button>
    <div class="app-trailing-items" id="appTrailingItems">
    <div class="app-actions-items" id="appActionsItems">
    <details class="settings-menu" id="settingsMenu">
      <summary id="settingsSummary" class="icon-button" aria-label="Settings" title="Settings">
        {{SETTINGS_ICON_SVG}}
        <span class="settings-alert-dot" id="settingsAlertDot" aria-hidden="true" hidden></span>
      </summary>
      <div class="settings-panel" role="group" aria-labelledby="settingsSummary">
        <button type="button" class="settings-update" id="settingsUpdate" hidden>
          <!-- Progress fill behind the label: the download's only honest signal
               that bytes are moving. Width is set from the percent. -->
          <span class="settings-update-fill" id="settingsUpdateFill" aria-hidden="true"></span>
          <span class="settings-spinner" id="settingsUpdateSpinner" aria-hidden="true" hidden></span>
          <span class="settings-update-label" id="settingsUpdateLabel"></span>
        </button>
        <button type="button" class="setting-theme-open" id="themeSheetOpen" aria-haspopup="dialog">
          <svg class="setting-theme-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg>
          <span class="setting-label">Theme</span>
          <span class="setting-theme-current" id="themeCurrentLabel"></span>
          <span class="setting-theme-chevron" aria-hidden="true">›</span>
        </button>
        <label class="setting-control" for="graphScope">
          <span class="setting-label">Graph size</span>
          <select id="graphScope" aria-label="Graph size" aria-describedby="graphScopeHelp">
            <option value="small">Focus (open document + links)</option>
            <option value="medium">Medium (up to 2,000)</option>
            <option value="large">Large (up to 5,000)</option>
            <option value="xl">Everything</option>
          </select>
          <span class="setting-help" id="graphScopeHelp">How many documents the graph view draws. Smaller is faster.</span>
        </label>
        <label class="setting-control setting-control-inline" for="minimapEnabled">
          <input type="checkbox" id="minimapEnabled" aria-label="Show document minimap" aria-describedby="minimapEnabledHelp">
          <span class="setting-label">Show minimap</span>
          <span class="setting-help" id="minimapEnabledHelp">Show a scrollable document overview on wider windows.</span>
        </label>
        <label class="setting-control setting-control-inline" for="pagerEnabled">
          <input type="checkbox" id="pagerEnabled" aria-label="Show next and previous links" aria-describedby="pagerEnabledHelp">
          <span class="setting-label">Show next/previous</span>
          <span class="setting-help" id="pagerEnabledHelp">Add Previous and Next links at the bottom of each document, ordered by the folder tree.</span>
        </label>
        <!-- The version, and nothing about the updater: it checks and downloads on
             its own, and the only thing worth a word is the restart button above. -->
        <div class="settings-footer">
          <p class="settings-version">
            <span>Version</span>
            <span class="settings-version-number" id="settingsVersion"></span>
          </p>
        </div>
      </div>
    </details>
    <button type="button" id="openButton" class="icon-button open-button" aria-label="Open" title="Open Markdown file">{{OPEN_ICON_SVG}}</button>
    <!-- Beside the folder: that one opens a document that exists, this one
         starts a document that doesn't. -->
    <button type="button" id="newButton" class="icon-button new-button" aria-label="New document" title="New document">{{NEW_ICON_SVG}}</button>
    </div>
    <div class="window-controls" id="windowControls" hidden aria-hidden="true">
      <button type="button" class="window-control" id="winMinimize" tabindex="-1" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 12 12" aria-hidden="true"><line x1="2.5" y1="6.5" x2="9.5" y2="6.5" stroke="currentColor" stroke-width="1"/></svg></button>
      <button type="button" class="window-control" id="winMaximize" tabindex="-1" aria-label="Maximize" title="Maximize"><svg class="wc-maximize" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg><svg class="wc-restore" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="4" width="5.5" height="5.5" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4.5 4V2.5H9.5V7.5H8" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="window-control window-control-close" id="winClose" tabindex="-1" aria-label="Close" title="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/></svg></button>
    </div>
    </div>
    <!-- Where actions land as the tab strip runs out of room, one at a time.
         Empty until something folds; the window controls never do. -->
    <div class="app-overflow-panel" id="appOverflowPanel"></div>
  </div>
  <!-- The card's top-right corner, where the bar's divider turns down into the
       card's right border. See .reader-corner. -->
  <div class="reader-corner reader-corner-tr" aria-hidden="true"></div>
</header>
<div id="libraryShell" class="library-shell">
<aside id="libraryPane" class="library-pane">
  <div class="library-scroll">
    <div id="librarySearchResults" class="library-results" hidden></div>
    <div id="libraryTree" class="library-tree"></div>
  </div>
  <!-- Where you are: the folder path, one crumb per level, with the graph
       toggle on the right. Its own band above the search row, same treatment. -->
  <div class="library-crumbs" id="libraryCrumbs">
    <button type="button" id="libraryVaultSwitch" class="library-vault-switch" aria-haspopup="menu" aria-expanded="false" title="Vaults" aria-label="Vaults">{{PACKAGE_OPEN_ICON_SVG}}<span class="library-crumb-caret" aria-hidden="true">▾</span></button>
    <nav class="library-crumb-trail" id="libraryCrumbTrail" aria-label="Folder path"></nav>
    <!-- Present only when this vault has work that has not reached GitHub. A
         button that is always there says nothing; one that appears is the
         message. -->
    <button type="button" id="librarySyncButton" class="library-sync" aria-label="Sync" hidden>{{SYNC_ICON_SVG}}<span class="library-sync-count"></span></button>
  </div>
  <div class="library-header">
    <div class="library-search-wrap">
      <input id="librarySearch" class="library-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search files...">
    </div>
  </div>
  <div id="libraryDivider" class="library-divider" title="Resize library" role="separator" aria-orientation="vertical"></div>
  <!-- The card's top-left corner. A child of the pane so it is placed by the same
       grid line as the card's left border and can't drift off it. See
       .reader-corner. -->
  <div class="reader-corner reader-corner-tl" aria-hidden="true"></div>
</aside>
<main id="app" class="reader-shell"></main>
<!-- The graph, in the page rather than the pane. A map of the whole vault needs
     the room the reader has; at 240px in the sidebar its labels were unreadable
     and clicking a node shoved the answer somewhere you were not looking. Same
     grid cell as the reader, shown in its place. -->
<div id="readerGraph" class="reader-graph" hidden>
  <div id="readerGraphCanvas" class="reader-graph-canvas"></div>
  <!-- Shown only when the drawn map has a web address in it. A ring and a domain
       name are close to self-explanatory, but "close to" is not the same as "is",
       and clicking one leaves the app for the browser. -->
  <p id="readerGraphLegend" class="reader-graph-legend" hidden>
    <span class="graph-key graph-key-document" aria-hidden="true"></span>your documents<span class="graph-key graph-key-external" aria-hidden="true"></span>web addresses
  </p>
  <p id="readerGraphStatus" class="reader-graph-status" aria-live="polite" hidden></p>
</div>
<!-- Soft edges for the page. The card's top slides under an opaque bar and its
     bottom stops at a hairline, so text used to end mid-stroke at both. This
     overlays the same grid cell (it can't live inside the scroller — an absolute
     child there scrolls with the content) and washes the last few pixels back to
     the page color. -->
<!-- Views and edits, floating over the foot of the page rather than crowded
     into the top-right strip beside Settings and Open. Which view you are in is
     the pressed button, so the bar answers "where am I" as well as "what can I
     do". Its own grid cell placement, not a child of the scroller, or it would
     scroll away with the document. -->
<div id="readerToolbar" class="reader-toolbar" role="toolbar" aria-label="Views and edits" hidden>
  <div class="reader-tool-group" role="group" aria-label="Views">
    <!-- What the view you are in can do, in one recess to the left of the three
         view buttons rather than wedged between them, so reading / source /
         graph always read as one unbroken group. The padlock is the app's one
         answer to "can I type here", so it stands in both editable views; the
         speed reader and the wand each belong to one. Nothing on a map, so the
         recess goes with it. Sunk and grained rather than same-level buttons,
         which would read as more views. -->
    <span id="readerViewTools" class="reader-view-tools" role="group" aria-label="Editing tools" hidden>
      <button type="button" id="readerLockButton" class="reader-subtool" aria-pressed="false" aria-label="Unlock to edit" title="Unlock to edit"><span class="reader-swap-glyph reader-glyph-off">{{LOCK_CLOSED_ICON_SVG}}</span><span class="reader-swap-glyph reader-glyph-on">{{LOCK_OPEN_ICON_SVG}}</span></button>
      <button type="button" id="speedReaderButton" class="reader-subtool" aria-pressed="false" aria-label="Speed reader" title="Speed reader"><span class="reader-swap-glyph reader-glyph-off">{{SPEED_READER_OFF_ICON_SVG}}</span><span class="reader-swap-glyph reader-glyph-on">{{SPEED_READER_ON_ICON_SVG}}</span></button>
      <button type="button" id="codeIntelButton" class="reader-subtool" aria-pressed="true" aria-label="Typing help" title="Typing help">{{WAND_ICON_SVG}}</button>
    </span>
    <button type="button" id="viewReadingButton" class="reader-tool" data-view="reading" aria-pressed="true" aria-label="Reading" title="Reading">{{DOCUMENT_ICON_SVG}}</button>
    <button type="button" id="viewCodeButton" class="reader-tool" data-view="code" aria-pressed="false" aria-label="View source" title="View source">{{CODE_VIEW_ICON_SVG}}</button>
    <button type="button" id="viewGraphButton" class="reader-tool" data-view="graph" aria-pressed="false" aria-label="Graph" title="Show how these documents link">{{GRAPH_ICON_SVG}}</button>
  </div>
  <span class="reader-tool-divider" aria-hidden="true"></span>
  <button type="button" id="undoButton" class="reader-tool undo-button" aria-label="Undo" title="Undo last edit" hidden><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" /></svg></button>
  <button type="button" id="saveButton" class="reader-tool-save" aria-label="Save" title="Save" hidden>Save</button>
</div>
<div id="readerEdgeFade" class="reader-edge-fade" aria-hidden="true"></div>
<!-- The minimap rail. Outside the card on purpose: it is chrome, so it sits on
     the shell's texture in its own column and the page's border stops short of
     it. Left empty rather than hidden when there is no minimap — the shell sizes
     that column with :has(.document-minimap), which a hidden host would still
     match. -->
<div id="readerMinimap" class="reader-minimap" aria-hidden="true"></div>
<div id="readerLoading" class="reader-loading" role="status" aria-live="polite" aria-label="Loading document…" hidden>
  <div class="reader-loading-spinner" aria-hidden="true"></div>
</div>
</div>
<div id="glossaryBackdrop" class="glossary-backdrop" hidden></div>
<aside id="glossarySheet" class="leaf-sheet glossary-sheet" role="dialog" aria-modal="true" aria-label="Glossary" hidden>
  <div class="leaf-sheet-grip"></div>
  <button type="button" id="glossarySheetClose" class="leaf-sheet-close" aria-label="Close glossary"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg></button>
  <div id="glossarySheetBody" class="glossary-sheet-body document-body"></div>
  <div class="glossary-sheet-footer"><button type="button" id="glossaryFullLink" class="glossary-sheet-fulllink">Open the full glossary</button></div>
</aside>
<div id="themeBackdrop" class="theme-sheet-backdrop" hidden></div>
<aside id="themeSheet" class="leaf-sheet theme-sheet" role="dialog" aria-modal="true" aria-label="Themes" hidden>
  <div class="leaf-sheet-grip"></div>
  <div class="theme-sheet-head">
    <span class="theme-sheet-title">Themes</span>
    <button type="button" id="themeSheetClose" class="leaf-sheet-close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg></button>
  </div>
  <div class="theme-sheet-modes" id="themeSheetModes" role="group" aria-label="Appearance">
    <button type="button" class="theme-mode-btn" data-mode="system">System</button>
    <button type="button" class="theme-mode-btn" data-mode="light">Light</button>
    <button type="button" class="theme-mode-btn" data-mode="dark">Dark</button>
    <button type="button" class="theme-mode-btn" data-mode="daylight">Daylight</button>
  </div>
  <hr class="theme-sheet-divider" />
  <ul class="theme-sheet-grid" id="themeSheetGrid">{{THEME_ITEMS}}</ul>
  <div class="theme-sheet-footer">
    <a href="#" id="themeSheetBrowse" class="theme-sheet-browse">Add your own theme on GitHub →</a>
  </div>
</aside>
<div id="flowBackdrop" class="flow-sheet-backdrop" hidden></div>
<!-- The flowchart sheet: a canvas and a code pane, peers over one graph. Both
     panes are built by flow-canvas.js; only the frame is declared here. -->
<aside id="flowSheet" class="flow-sheet" role="dialog" aria-modal="true" aria-label="Flowchart" hidden>
  <!-- Every way of making something lives on the canvas: double-click, a box's
       + handles, or right-click. What is left up here is chrome. -->
  <div class="flow-sheet-head" id="flowSheetHead">
    <span class="flow-sheet-title" id="flowSheetTitle">Flowchart</span>
    <div class="flow-sheet-tools">
      <div class="flow-steps" role="group" aria-label="History">
        <button type="button" id="flowUndo" aria-label="Undo" title="Undo"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" /></svg></button>
        <button type="button" id="flowRedo" aria-label="Redo" title="Redo"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m15 15 6-6m0 0-6-6m6 6H9a6 6 0 0 0 0 12h3" /></svg></button>
      </div>
      <label class="flow-sheet-direction">Flow <select id="flowDirection"></select></label>
      <!-- The same three the reading view puts on a drawn diagram, so looking at
           one is the same gesture wherever you are. Each tooltip names the other
           way of doing it: the wheel and the drag announce themselves nowhere. -->
      <div class="flow-zoom" role="group" aria-label="Zoom">
        <button type="button" id="flowZoomOut" title="Zoom out — or Ctrl and the wheel" aria-label="Zoom out">{{ZOOM_OUT_ICON_SVG}}</button>
        <button type="button" id="flowZoomFit" title="Whole diagram, back where it started" aria-label="Fit the diagram">{{FIT_ICON_SVG}}</button>
        <button type="button" id="flowZoomIn" title="Zoom in — or Ctrl and the wheel. Drag empty space to move it" aria-label="Zoom in">{{ZOOM_IN_ICON_SVG}}</button>
      </div>
    </div>
    <div class="flow-sheet-actions">
      <button type="button" id="flowSheetExport" class="flow-sheet-export">Export</button>
      <button type="button" id="flowSheetCancel" class="flow-sheet-cancel">Cancel</button>
      <button type="button" id="flowSheetSave" class="flow-sheet-save">Save</button>
    </div>
  </div>
  <div class="flow-sheet-panes">
    <section class="flow-pane flow-pane-canvas" aria-label="Diagram">
      <p class="flow-hint" id="flowHint"></p>
      <div class="flow-canvas" id="flowCanvas" tabindex="0"></div>
      <p class="flow-notice" id="flowNotice" hidden></p>
    </section>
    <div class="flow-split" id="flowSplit" role="separator" aria-orientation="vertical" aria-label="Resize the text pane" tabindex="0"></div>
    <section class="flow-pane flow-pane-code" aria-label="Mermaid text">
      <!-- Said here because here is where it shows: Save writes the diagram out
           afresh rather than patching the lines someone typed. Tidying one box
           and finding the whole block reflowed is a nasty surprise to have to
           work out for yourself. -->
      <p class="flow-code-note">Save rewrites the whole block: one box to a line, every label quoted.</p>
      <textarea id="flowCode" class="flow-code" spellcheck="false" aria-label="Mermaid text"></textarea>
    </section>
  </div>
  <!-- What a box or a line can be changed to, and the same sheet the shape
       picker uses: one component, so adding a box and changing one read the same
       way. A child of the sheet rather than of the canvas pane, so it slides up
       centered on the whole editor and not on the half left of the text. -->
  <aside class="leaf-sheet flow-picker" id="flowPicker" role="dialog" aria-label="Shapes" hidden>
    <div class="leaf-sheet-grip"></div>
    <button type="button" id="flowPickerClose" class="leaf-sheet-close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg></button>
    <!-- The name stays put while the shapes scroll under it: it is the one field
         in here, and losing it off the top mid-list is how a box ends up unnamed. -->
    <div class="flow-picker-head" id="flowPickerHead"></div>
    <div class="flow-picker-body leaf-scroll" id="flowPickerBody"></div>
  </aside>
</aside>
<!-- The flowchart editor, over the asset protocol rather than inline: it is the
     largest thing the shell carries and the page is handed to WebView2 as one
     string with a ceiling on it. A plain script tag, so it shares the one scope
     the rest of the front-end has, and it is first so everything it declares is
     there before the script below runs. -->
<script src="{{FLOW_SCRIPT_URL}}"></script>
<script>
{{APP_SCRIPT}}
</script>
</body>
</html>
