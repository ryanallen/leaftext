<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http://leaf-image.local leaf-image: data:; script-src 'self' 'unsafe-inline' http://leaf-asset.local leaf-asset:; style-src 'self' 'unsafe-inline' http://leaf-asset.local leaf-asset: https://fonts.googleapis.com; font-src 'self' data: http://leaf-asset.local leaf-asset: https://fonts.gstatic.com; connect-src 'self' https://api.github.com">
<title>Leaf Text</title>
<script>{{THEME_BOOTSTRAP_SCRIPT}}</script>
<script>{{LOCALE_BOOTSTRAP_SCRIPT}}</script>
<link rel="stylesheet" href="{{KATEX_CSS_URL}}">
<link rel="stylesheet" href="{{APP_CSS_URL}}">
</head>
<body>
<header id="appBar" class="app-bar">
  <div class="app-bar-lead">
    <button type="button" id="homeButton" class="brand-button" data-i18n-aria-label="actions.home" data-i18n-title="actions.home.title" aria-label="Home" title="Home">
      <svg class="brand" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M59.7,60.1c-7.9-20.9-22.3-20.7-32.6-24.8-10.3-4.1-15.9-11.9-15.9-11.9,0,0,7.1,6.9,15.9,9.7,8.9,2.7,23,1.1,31.4,18.6-2.4-10.1-5.7-28.3-27-29.9C10.3,20.2,4.4,3.9,4.4,3.9c0,0-1.5,23.4,7.6,36.5,9,13.1,17,19,41.1,17.3,0,0,5.5-.4,6.7,2.5h0Z" fill="currentColor"/></svg>
    </button>
    <nav class="history-actions" aria-label="Document history">
      <button type="button" id="backButton" class="icon-button history-button" data-i18n-aria-label="actions.back" data-i18n-title="actions.back.title" aria-label="Back" title="Back" disabled>
        {{BACK_ICON_SVG}}
      </button>
      <button type="button" id="forwardButton" class="icon-button history-button" data-i18n-aria-label="actions.forward" data-i18n-title="actions.forward.title" aria-label="Forward" title="Forward" disabled>
        {{FORWARD_ICON_SVG}}
      </button>
    </nav>
  </div>
  <div class="tab-bar" id="tabBar" role="tablist" aria-label="Open documents"></div>
  <div class="app-actions">
    <button type="button" id="codeViewButton" class="icon-button code-view-button" data-i18n-aria-label="actions.codeView" data-i18n-title="actions.codeView.title" aria-label="View source" title="View source" aria-pressed="false" hidden><span class="cv-icon cv-icon-code">{{CODE_VIEW_ICON_SVG}}</span><span class="cv-icon cv-icon-doc">{{DOCUMENT_ICON_SVG}}</span></button>
    <details class="settings-menu" id="settingsMenu">
      <summary id="settingsSummary" class="icon-button" data-i18n-aria-label="settings.heading" data-i18n-title="settings.heading" aria-label="Settings" title="Settings">
        {{SETTINGS_ICON_SVG}}
        <span class="settings-alert-dot" id="settingsAlertDot" aria-hidden="true" hidden></span>
      </summary>
      <div class="settings-panel" role="group" aria-labelledby="settingsSummary">
        <button type="button" class="settings-update" id="settingsUpdate" hidden></button>
        <button type="button" class="setting-theme-open" id="themeSheetOpen" aria-haspopup="dialog">
          <span class="setting-label" data-i18n="settings.theme.label">Theme</span>
          <span class="setting-theme-current" id="themeCurrentLabel"></span>
          <span class="setting-theme-chevron" aria-hidden="true">›</span>
        </button>
        <label class="setting-control" for="graphScope">
          <span class="setting-label" data-i18n="settings.graphScope.label">Graph size</span>
          <select id="graphScope" aria-label="Graph size" aria-describedby="graphScopeHelp">
            <option value="small" data-i18n="settings.graphScope.small">Focus (open document + links)</option>
            <option value="medium" data-i18n="settings.graphScope.medium">Medium (up to 2,000)</option>
            <option value="large" data-i18n="settings.graphScope.large">Large (up to 5,000)</option>
            <option value="xl" data-i18n="settings.graphScope.xl">Everything</option>
          </select>
          <span class="setting-help" id="graphScopeHelp" data-i18n="settings.graphScope.help">How many documents the graph view draws. Smaller is faster.</span>
        </label>
        <label class="setting-control setting-control-inline" for="minimapEnabled">
          <input type="checkbox" id="minimapEnabled" aria-label="Show document minimap" aria-describedby="minimapEnabledHelp">
          <span class="setting-label" data-i18n="settings.minimap.label">Show minimap</span>
          <span class="setting-help" id="minimapEnabledHelp" data-i18n="settings.minimap.help">Show a scrollable document overview on wider windows.</span>
        </label>
        <label class="setting-control setting-control-inline" for="pagerEnabled">
          <input type="checkbox" id="pagerEnabled" aria-label="Show next and previous links" aria-describedby="pagerEnabledHelp">
          <span class="setting-label">Show next/previous</span>
          <span class="setting-help" id="pagerEnabledHelp">Add Previous and Next links at the bottom of each document, ordered by the folder tree.</span>
        </label>
        <label class="setting-control setting-control-inline" for="speedReaderEnabled">
          <input type="checkbox" id="speedReaderEnabled" aria-label="Speed Reader" aria-describedby="speedReaderEnabledHelp">
          <span class="setting-label" data-i18n="settings.speedReader.label">Speed Reader</span>
          <span class="setting-help" id="speedReaderEnabledHelp" data-i18n="settings.speedReader.help">Make prose quieter and add bold lead anchors for faster scanning.</span>
        </label>
        <label class="setting-control setting-control-inline" for="lineNumbersEnabled">
          <input type="checkbox" id="lineNumbersEnabled" aria-label="Show line numbers" aria-describedby="lineNumbersEnabledHelp">
          <span class="setting-label" data-i18n="settings.lineNumbers.label">Line numbers</span>
          <span class="setting-help" id="lineNumbersEnabledHelp" data-i18n="settings.lineNumbers.help">Number each block in the left margin as a copyable permalink.</span>
        </label>
        <label class="setting-control setting-control-inline" for="readerEditingEnabled">
          <input type="checkbox" id="readerEditingEnabled" aria-label="Edit in reading view" aria-describedby="readerEditingEnabledHelp">
          <span class="setting-label" data-i18n="settings.readerEditing.label">Edit in reading view</span>
          <span class="setting-help" id="readerEditingEnabledHelp" data-i18n="settings.readerEditing.help">Click into the rendered page to edit it. Turn off to keep the reading view read-only; the code view still edits the source.</span>
        </label>
        <label class="setting-control setting-control-inline" for="indexingEnabled">
          <input type="checkbox" id="indexingEnabled" aria-describedby="indexingEnabledHelp">
          <span class="setting-label" data-i18n="settings.indexing.label">Index entire device</span>
          <span class="setting-help" id="indexingEnabledHelp" data-i18n="settings.indexing.help">Crawl this device for Markdown files and rescan each time you open the app.</span>
        </label>
      </div>
    </details>
    <button type="button" id="openButton" class="icon-button open-button" data-i18n-aria-label="actions.open" data-i18n-title="actions.open.title" aria-label="Open" title="Open Markdown file">{{OPEN_ICON_SVG}}</button>
    <button type="button" id="saveButton" class="save-button" data-i18n="actions.save" data-i18n-aria-label="actions.save" data-i18n-title="actions.save.title" aria-label="Save" title="Save" hidden>Save</button>
    <button type="button" id="undoButton" class="icon-button undo-button" data-i18n-aria-label="actions.undo" data-i18n-title="actions.undo.title" aria-label="Undo" title="Undo last edit" hidden><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" /></svg></button>
  </div>
  <div class="window-controls" id="windowControls" hidden aria-hidden="true">
    <button type="button" class="window-control" id="winMinimize" tabindex="-1" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 12 12" aria-hidden="true"><line x1="2.5" y1="6.5" x2="9.5" y2="6.5" stroke="currentColor" stroke-width="1"/></svg></button>
    <button type="button" class="window-control" id="winMaximize" tabindex="-1" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
    <button type="button" class="window-control window-control-close" id="winClose" tabindex="-1" aria-label="Close" title="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/></svg></button>
  </div>
</header>
<div id="libraryShell" class="library-shell">
<aside id="libraryPane" class="library-pane">
  <div class="library-scroll">
    <div id="librarySearchResults" class="library-results" hidden></div>
    <div id="libraryTree" class="library-tree"></div>
    <div id="libraryGraph" class="library-graph" hidden>
      <div id="libraryGraphCanvas" class="library-graph-canvas"></div>
      <p id="libraryGraphStatus" class="library-graph-status" aria-live="polite" hidden></p>
    </div>
    <div id="libraryScanProgress" class="library-progress" aria-live="polite" hidden></div>
  </div>
  <div class="library-header">
    <div class="library-view-select" id="libraryViewSelect">
      <button type="button" id="libraryViewToggle" data-i18n-title="library.view.toggle" title="Switch library view" aria-haspopup="listbox" aria-expanded="false">
        <span id="libraryViewLabel">All files</span>
        <span class="library-view-caret" aria-hidden="true">▾</span>
      </button>
      <ul id="libraryViewMenu" class="library-view-menu" role="listbox" hidden></ul>
    </div>
    <div class="library-search-wrap">
      <input id="librarySearch" class="library-search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="library.search.placeholder" placeholder="Search files...">
    </div>
  </div>
  <div id="libraryDivider" class="library-divider" data-i18n-title="library.divider.resize" title="Resize library" role="separator" aria-orientation="vertical"></div>
</aside>
<main id="app" class="reader-shell"></main>
<div id="readerLoading" class="reader-loading" role="status" aria-live="polite" data-i18n-aria-label="reader.loading" aria-label="Loading document…" hidden>
  <div class="reader-loading-spinner" aria-hidden="true"></div>
</div>
<button type="button" id="libraryOpen" class="library-open" data-i18n-title="library.open" data-i18n-aria-label="library.open" title="Open library" aria-label="Open library">{{OPEN_LIBRARY_ICON_SVG}}</button>
</div>
<div id="glossaryBackdrop" class="glossary-backdrop" hidden></div>
<aside id="glossarySheet" class="glossary-sheet" role="dialog" aria-modal="true" aria-label="Glossary" hidden>
  <div class="glossary-sheet-grip"></div>
  <button type="button" id="glossarySheetClose" class="glossary-sheet-close" aria-label="Close glossary"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg></button>
  <div id="glossarySheetBody" class="glossary-sheet-body document-body"></div>
  <div class="glossary-sheet-footer"><button type="button" id="glossaryFullLink" class="glossary-sheet-fulllink">Open the full glossary</button></div>
</aside>
<div id="themeBackdrop" class="theme-sheet-backdrop" hidden></div>
<aside id="themeSheet" class="theme-sheet" role="dialog" aria-modal="true" data-i18n-aria-label="settings.theme.sheet.title" aria-label="Themes" hidden>
  <div class="theme-sheet-grip"></div>
  <div class="theme-sheet-head">
    <span class="theme-sheet-title" data-i18n="settings.theme.sheet.title">Themes</span>
    <button type="button" id="themeSheetClose" class="theme-sheet-close" data-i18n-aria-label="settings.theme.sheet.close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg></button>
  </div>
  <div class="theme-sheet-modes" id="themeSheetModes" role="group" data-i18n-aria-label="settings.theme.appearance" aria-label="Appearance">
    <button type="button" class="theme-mode-btn" data-mode="system" data-i18n="settings.theme.system">System</button>
    <button type="button" class="theme-mode-btn" data-mode="light" data-i18n="settings.theme.light">Light</button>
    <button type="button" class="theme-mode-btn" data-mode="dark" data-i18n="settings.theme.dark">Dark</button>
    <button type="button" class="theme-mode-btn" data-mode="daylight" data-i18n="settings.theme.daylight">Daylight</button>
  </div>
  <hr class="theme-sheet-divider" />
  <ul class="theme-sheet-grid" id="themeSheetGrid">{{THEME_ITEMS}}</ul>
  <div class="theme-sheet-footer">
    <a href="#" id="themeSheetBrowse" class="theme-sheet-browse" data-i18n="settings.theme.sheet.browse">Add your own theme on GitHub →</a>
  </div>
</aside>
<script>
{{APP_SCRIPT}}
</script>
</body>
</html>
