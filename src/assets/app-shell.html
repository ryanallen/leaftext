<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http://leaf-image.local leaf-image: data:; script-src 'self' 'unsafe-inline' http://leaf-asset.local leaf-asset:; style-src 'self' 'unsafe-inline' http://leaf-asset.local leaf-asset: https://fonts.googleapis.com; font-src 'self' data: http://leaf-asset.local leaf-asset: https://fonts.gstatic.com; connect-src 'self' http://leaf-source.local leaf-source: https://api.github.com">
<title>Leaftext</title>
<script>{{THEME_BOOTSTRAP_SCRIPT}}</script>
<link rel="stylesheet" href="{{KATEX_CSS_URL}}">
<link rel="stylesheet" href="{{APP_CSS_URL}}">
</head>
<body>
<header id="appBar" class="app-bar">
  <div class="app-bar-lead">
    <button type="button" id="homeButton" class="brand-button" aria-label="Home" title="Home">
      <span class="lt-icon lt-icon-leaf"></span>
    </button>
    <button type="button" id="libraryOpen" class="icon-button library-open" title="Toggle library" aria-label="Toggle library"><span class="lt-icon lt-icon-open-library"></span></button>
    <nav class="history-actions" aria-label="Document history">
      <button type="button" id="backButton" class="icon-button history-button" aria-label="Back" title="Back" disabled>
        <span class="lt-icon lt-icon-back"></span>
      </button>
      <button type="button" id="forwardButton" class="icon-button history-button" aria-label="Forward" title="Forward" disabled>
        <span class="lt-icon lt-icon-forward"></span>
      </button>
    </nav>
  </div>
  <div class="tab-bar" id="tabBar" role="tablist" aria-label="Open documents"></div>
  <div class="app-trailing">
    <button type="button" id="overflowToggle" class="icon-button overflow-toggle" aria-haspopup="true" aria-expanded="false" aria-label="More options" title="More options"><span class="lt-icon lt-icon-chevron-down"></span></button>
    <div class="app-trailing-items" id="appTrailingItems">
    <div class="app-actions-items" id="appActionsItems">
    <!-- Only there when there is news: a ring while the new version downloads, a
         dot once a restart would install it, and nothing at all otherwise. -->
    <details class="update-menu" id="updateMenu" hidden>
      <summary id="updateSummary" class="icon-button" aria-label="Update" title="Update">
        <span class="lt-icon lt-icon-update"></span>
        <span class="update-alert-dot" id="updateAlertDot" aria-hidden="true" hidden></span>
      </summary>
      <div class="update-panel" role="group" aria-labelledby="updateSummary">
        <button type="button" class="update-button" id="updateButton" hidden>
          <!-- Progress fill behind the label: the download's only honest signal
               that bytes are moving. Width is set from the percent. -->
          <span class="update-button-fill" id="updateButtonFill" aria-hidden="true"></span>
          <span class="lt-spinner update-button-spinner" id="updateButtonSpinner" aria-hidden="true" hidden></span>
          <span class="update-button-label" id="updateButtonLabel"></span>
        </button>
      </div>
    </details>
    <!-- Where the settings sliders stood. Themes were the one thing anybody opened
         that menu for, so they are one click; the title carries the theme in use. -->
    <button type="button" id="themeSheetOpen" class="icon-button theme-button" aria-label="Themes" title="Themes" aria-haspopup="dialog">
      <span class="lt-icon lt-icon-theme"></span>
    </button>
    <button type="button" id="openButton" class="icon-button open-button" aria-label="Open" title="Open Markdown file"><span class="lt-icon lt-icon-open"></span></button>
    <!-- Beside the folder: that one opens a document that exists, this one
         starts a document that doesn't. -->
    <button type="button" id="newButton" class="icon-button new-button" aria-label="New document" title="New document"><span class="lt-icon lt-icon-new"></span></button>
    </div>
    <div class="window-controls" id="windowControls" hidden aria-hidden="true">
      <button type="button" class="window-control" id="winMinimize" tabindex="-1" aria-label="Minimize" title="Minimize"><span class="lt-icon lt-icon-window-minimize"></span></button>
      <button type="button" class="window-control" id="winMaximize" tabindex="-1" aria-label="Maximize" title="Maximize"><span class="lt-icon wc-maximize lt-icon-window-maximize"></span><span class="lt-icon wc-restore lt-icon-window-restore"></span></button>
      <button type="button" class="window-control window-control-close" id="winClose" tabindex="-1" aria-label="Close" title="Close"><span class="lt-icon lt-icon-window-close"></span></button>
    </div>
    </div>
    <!-- Where actions land as the tab strip runs out of room, one at a time.
         Empty until something folds; the window controls never do. -->
    <div class="app-overflow-panel" id="appOverflowPanel"></div>
  </div>
  <!-- The card's top-right corner, where the bar's divider turns down into the
       card's right border. See .reader-corner. -->
  <div class="reader-corner reader-corner-tr" aria-hidden="true"></div>
</header>
<div id="libraryShell" class="library-shell">
<aside id="libraryPane" class="library-pane">
  <div class="library-scroll">
    <div id="librarySearchResults" class="library-results" hidden></div>
    <div id="libraryTree" class="library-tree"></div>
  </div>
  <!-- Where you are: the folder path, one crumb per level, with the graph
       toggle on the right. Its own band above the search row, same treatment. -->
  <div class="library-crumbs" id="libraryCrumbs">
    <button type="button" id="libraryVaultSwitch" class="library-vault-switch" aria-haspopup="menu" aria-expanded="false" title="Vaults" aria-label="Vaults"><span class="library-crumb-caret" aria-hidden="true">▾</span><span class="lt-icon lt-icon-computer"></span></button>
    <nav class="library-crumb-trail" id="libraryCrumbTrail" aria-label="Folder path"></nav>
    <!-- Present only when this vault has work that has not reached GitHub. A
         button that is always there says nothing; one that appears is the
         message. -->
    <button type="button" id="librarySyncButton" class="library-sync" aria-label="Sync" hidden><span class="lt-icon lt-icon-sync"></span><span class="library-sync-count"></span></button>
  </div>
  <div class="library-header">
    <div class="library-search-wrap">
      <input id="librarySearch" class="library-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search files...">
    </div>
  </div>
  <div id="libraryDivider" class="library-divider" title="Resize library" role="separator" aria-orientation="vertical"></div>
  <!-- The card's top-left corner. A child of the pane so it is placed by the same
       grid line as the card's left border and can't drift off it. See
       .reader-corner. -->
  <div class="reader-corner reader-corner-tl" aria-hidden="true"></div>
</aside>
<main id="app" class="reader-shell"></main>
<!-- The graph, in the page rather than the pane. A map of the whole vault needs
     the room the reader has; at 240px in the sidebar its labels were unreadable
     and clicking a node shoved the answer somewhere you were not looking. Same
     grid cell as the reader, shown in its place. -->
<div id="readerGraph" class="reader-graph" hidden>
  <div id="readerGraphCanvas" class="reader-graph-canvas"></div>
  <!-- Shown only when the drawn map has a web address in it. A ring and a domain
       name are close to self-explanatory, but "close to" is not the same as "is",
       and clicking one leaves the app for the browser. -->
  <p id="readerGraphLegend" class="reader-graph-legend" hidden>
    <span class="graph-key graph-key-document" aria-hidden="true"></span>your documents<span class="graph-key graph-key-external" aria-hidden="true"></span>web addresses
  </p>
  <p id="readerGraphStatus" class="reader-graph-status" aria-live="polite" hidden></p>
</div>
<!-- Soft edges for the page. The card's top slides under an opaque bar and its
     bottom stops at a hairline, so text used to end mid-stroke at both. This
     overlays the same grid cell (it can't live inside the scroller — an absolute
     child there scrolls with the content) and washes the last few pixels back to
     the page color. -->
<!-- Views and edits, floating over the foot of the page rather than crowded
     into the top-right strip beside Settings and Open. Which view you are in is
     the pressed button, so the bar answers "where am I" as well as "what can I
     do". Its own grid cell placement, not a child of the scroller, or it would
     scroll away with the document. -->
<div id="readerToolbar" class="reader-toolbar" role="toolbar" aria-label="Views and edits" hidden>
  <div class="reader-tool-group" role="group" aria-label="Views">
    <!-- What the view you are in can do, in one recess to the left of the three
         view buttons rather than wedged between them, so reading / source /
         graph always read as one unbroken group. The padlock is the app's one
         answer to "can I type here", so it stands in both editable views; the
         speed reader and the wand each belong to one, and the map's one setting
         is how big a graph to draw. Sunk and grained rather than same-level
         buttons, which would read as more views. -->
    <span id="readerViewTools" class="reader-view-tools" role="group" aria-label="Editing tools" hidden>
      <label class="reader-subselect" id="graphScopeTool" hidden>
        <span class="reader-subselect-label">Graph size</span>
        <select id="graphScope" aria-label="Graph size" title="How many documents the graph view draws. Smaller is faster.">
          <option value="small">Focus</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
          <option value="xl">Everything</option>
        </select>
      </label>
      <button type="button" id="readerLockButton" class="reader-subtool" aria-pressed="false" aria-label="Unlock to edit" title="Unlock to edit"><span class="reader-swap-glyph reader-glyph-off"><span class="lt-icon lt-icon-lock-closed"></span></span><span class="reader-swap-glyph reader-glyph-on"><span class="lt-icon lt-icon-lock-open"></span></span></button>
      <button type="button" id="speedReaderButton" class="reader-subtool" aria-pressed="false" aria-label="Speed reader" title="Speed reader"><span class="reader-swap-glyph reader-glyph-off"><span class="lt-icon lt-icon-speed-reader-off"></span></span><span class="reader-swap-glyph reader-glyph-on"><span class="lt-icon lt-icon-speed-reader-on"></span></span></button>
      <button type="button" id="codeIntelButton" class="reader-subtool" aria-pressed="true" aria-label="Typing help" title="Typing help"><span class="lt-icon lt-icon-wand"></span></button>
    </span>
    <button type="button" id="viewReadingButton" class="reader-tool" data-view="reading" aria-pressed="true" aria-label="Reading" title="Reading"><span class="lt-icon lt-icon-document"></span></button>
    <button type="button" id="viewCodeButton" class="reader-tool" data-view="code" aria-pressed="false" aria-label="View source" title="View source"><span class="lt-icon lt-icon-code-view"></span></button>
    <button type="button" id="viewGraphButton" class="reader-tool" data-view="graph" aria-pressed="false" aria-label="Graph" title="Show how these documents link"><span class="lt-icon lt-icon-graph"></span></button>
  </div>
  <span class="reader-tool-divider" aria-hidden="true"></span>
  <button type="button" id="undoButton" class="reader-tool undo-button" aria-label="Undo" title="Undo last edit" hidden><span class="lt-icon lt-icon-undo"></span></button>
  <button type="button" id="saveButton" class="reader-tool-save" aria-label="Save" title="Save" hidden>Save</button>
</div>
<!-- Find, over whichever view is on screen. One bar for both: the source view's
     editor ships without a find widget, and a second bar in one view only would
     be two keyboard paths to learn. Its own grid cell placement, like the
     toolbar's, so it does not scroll away with the document. See find-bar.js. -->
<div id="findBar" class="find-bar" role="search" aria-label="Find in this document" hidden>
  <div class="find-row">
    <span class="find-field">
      <input id="findInput" class="find-input" type="text" autocomplete="off" spellcheck="false" placeholder="Find" aria-label="Find">
      <!-- Which match you are on, out of how many, as you type. -->
      <span id="findCount" class="find-count" aria-live="polite"></span>
    </span>
    <span class="find-flags" role="group" aria-label="How to match">
      <button type="button" id="findMatchCase" class="find-flag icon-button" aria-pressed="false" aria-label="Match case" title="Match case (Alt+C)">Aa</button>
      <button type="button" id="findWholeWord" class="find-flag icon-button" aria-pressed="false" aria-label="Whole word" title="Whole word (Alt+W)">ab|</button>
      <button type="button" id="findRegex" class="find-flag icon-button" aria-pressed="false" aria-label="Regular expression" title="Regular expression (Alt+R)">.*</button>
      <button type="button" id="findInSelection" class="find-flag icon-button" aria-pressed="false" aria-label="Find in selection" title="Find in selection (Alt+L)"><span class="lt-icon lt-icon-text"></span></button>
    </span>
    <button type="button" id="findPrev" class="find-step icon-button" aria-label="Previous match" title="Previous match (Shift+Enter)"><span class="lt-icon lt-icon-chevron-down find-step-back"></span></button>
    <button type="button" id="findNext" class="find-step icon-button" aria-label="Next match" title="Next match (Enter)"><span class="lt-icon lt-icon-chevron-down"></span></button>
    <!-- An action, so it stands with the other actions rather than with the
         toggles: it opens the Replace row below. -->
    <button type="button" id="findReplaceToggle" class="find-step icon-button" aria-pressed="false" aria-label="Replace" title="Replace (Ctrl+H)"><span class="lt-icon lt-icon-replace"></span></button>
    <button type="button" id="findClose" class="find-step icon-button" aria-label="Close find" title="Close (Escape)"><span class="lt-icon lt-icon-close"></span></button>
  </div>
  <!-- Down only when asked for: most finding is reading, not rewriting. -->
  <div class="find-row find-replace-row" id="findReplaceRow" hidden>
    <span class="find-field">
      <input id="findReplaceInput" class="find-input" type="text" autocomplete="off" spellcheck="false" placeholder="Replace with" aria-label="Replace with">
    </span>
    <button type="button" id="findReplaceOne" class="find-action icon-button">Replace</button>
    <button type="button" id="findReplaceAll" class="find-action icon-button">All</button>
    <button type="button" id="findSelectAll" class="find-action icon-button" title="Put a cursor on every match (Alt+Enter)">Select all</button>
  </div>
</div>
<div id="readerEdgeFade" class="reader-edge-fade" aria-hidden="true"><span class="reader-edge-fade-side reader-edge-fade-left"></span><span class="reader-edge-fade-side reader-edge-fade-right"></span></div>
<!-- The minimap rail. Outside the card on purpose: it is chrome, so it sits on
     the shell's texture in its own column and the page's border stops short of
     it. Left empty rather than hidden when there is no minimap — the shell sizes
     that column with :has(.document-minimap), which a hidden host would still
     match. -->
<div id="readerMinimap" class="reader-minimap" aria-hidden="true"></div>
<div id="readerLoading" class="reader-loading" role="status" aria-live="polite" aria-label="Loading document…" hidden>
  <div class="lt-spinner reader-loading-spinner" aria-hidden="true"></div>
</div>
</div>
<div id="glossaryBackdrop" class="lt-backdrop" hidden></div>
<aside id="glossarySheet" class="leaf-sheet glossary-sheet" role="dialog" aria-modal="true" aria-label="Glossary" hidden>
  <div class="leaf-sheet-grip"></div>
  <button type="button" id="glossarySheetClose" class="leaf-sheet-close" aria-label="Close glossary"><span class="lt-icon lt-icon-close"></span></button>
  <div id="glossarySheetBody" class="glossary-sheet-body document-body"></div>
  <div class="glossary-sheet-footer"><button type="button" id="glossaryFullLink" class="glossary-sheet-fulllink">Open the full glossary</button></div>
</aside>
<div id="themeBackdrop" class="lt-backdrop" hidden></div>
<aside id="themeSheet" class="leaf-sheet theme-sheet" role="dialog" aria-modal="true" aria-label="Themes" hidden>
  <div class="leaf-sheet-grip"></div>
  <div class="theme-sheet-head">
    <span class="theme-sheet-title">Themes</span>
    <button type="button" id="themeSheetClose" class="leaf-sheet-close" aria-label="Close"><span class="lt-icon lt-icon-close"></span></button>
  </div>
  <div class="theme-sheet-modes" id="themeSheetModes" role="group" aria-label="Appearance">
    <button type="button" class="theme-mode-btn" data-mode="system">System</button>
    <button type="button" class="theme-mode-btn" data-mode="light">Light</button>
    <button type="button" class="theme-mode-btn" data-mode="dark">Dark</button>
    <button type="button" class="theme-mode-btn" data-mode="daylight">Daylight</button>
  </div>
  <hr class="theme-sheet-divider" />
  <ul class="theme-sheet-grid" id="themeSheetGrid">{{THEME_ITEMS}}</ul>
  <div class="theme-sheet-footer">
    <a href="#" id="themeSheetBrowse" class="theme-sheet-browse">Add your own theme on GitHub →</a>
  </div>
</aside>
<div id="flowBackdrop" class="lt-backdrop" hidden></div>
<!-- The flowchart sheet: a canvas and a code pane, peers over one graph. Both
     panes are built by flow-canvas.js; only the frame is declared here. -->
<aside id="flowSheet" class="flow-sheet" role="dialog" aria-modal="true" aria-label="Flowchart" hidden>
  <!-- Every way of making something lives on the canvas: double-click, a box's
       + handles, or right-click. What is left up here is chrome. -->
  <div class="flow-sheet-head" id="flowSheetHead">
    <span class="flow-sheet-title" id="flowSheetTitle">Flowchart</span>
    <div class="flow-sheet-tools">
      <div class="flow-steps" role="group" aria-label="History">
        <button type="button" id="flowUndo" aria-label="Undo" title="Undo"><span class="lt-icon lt-icon-undo"></span></button>
        <button type="button" id="flowRedo" aria-label="Redo" title="Redo"><span class="lt-icon lt-icon-redo"></span></button>
      </div>
      <label class="flow-sheet-direction">Flow <select id="flowDirection"></select></label>
      <!-- The same three the reading view puts on a drawn diagram, so looking at
           one is the same gesture wherever you are. Each tooltip names the other
           way of doing it: the wheel and the drag announce themselves nowhere. -->
      <div class="flow-zoom" role="group" aria-label="Zoom">
        <button type="button" id="flowZoomOut" title="Zoom out — or Ctrl and the wheel" aria-label="Zoom out"><span class="lt-icon lt-icon-zoom-out"></span></button>
        <button type="button" id="flowZoomFit" title="Whole diagram, back where it started" aria-label="Fit the diagram"><span class="lt-icon lt-icon-fit"></span></button>
        <button type="button" id="flowZoomIn" title="Zoom in — or Ctrl and the wheel. Drag empty space to move it" aria-label="Zoom in"><span class="lt-icon lt-icon-zoom-in"></span></button>
      </div>
    </div>
    <div class="flow-sheet-actions">
      <button type="button" id="flowSheetExport" class="flow-sheet-export">Export</button>
      <button type="button" id="flowSheetCancel" class="flow-sheet-cancel">Cancel</button>
      <button type="button" id="flowSheetSave" class="flow-sheet-save">Save</button>
    </div>
  </div>
  <div class="flow-sheet-panes">
    <section class="flow-pane flow-pane-canvas" aria-label="Diagram">
      <p class="flow-hint" id="flowHint"></p>
      <div class="flow-canvas" id="flowCanvas" tabindex="0"></div>
      <p class="flow-notice" id="flowNotice" hidden></p>
    </section>
    <div class="flow-split" id="flowSplit" role="separator" aria-orientation="vertical" aria-label="Resize the text pane" tabindex="0"></div>
    <section class="flow-pane flow-pane-code" aria-label="Mermaid text">
      <!-- Said here because here is where it shows: Save writes the diagram out
           afresh rather than patching the lines someone typed. Tidying one box
           and finding the whole block reflowed is a nasty surprise to have to
           work out for yourself. -->
      <p class="flow-code-note">Save rewrites the whole block: one box to a line, every label quoted.</p>
      <textarea id="flowCode" class="flow-code" spellcheck="false" aria-label="Mermaid text"></textarea>
    </section>
  </div>
  <!-- What a box or a line can be changed to, and the same sheet the shape
       picker uses: one component, so adding a box and changing one read the same
       way. A child of the sheet rather than of the canvas pane, so it slides up
       centered on the whole editor and not on the half left of the text. -->
  <aside class="leaf-sheet flow-picker" id="flowPicker" role="dialog" aria-label="Shapes" hidden>
    <div class="leaf-sheet-grip"></div>
    <button type="button" id="flowPickerClose" class="leaf-sheet-close" aria-label="Close"><span class="lt-icon lt-icon-close"></span></button>
    <!-- The name stays put while the shapes scroll under it: it is the one field
         in here, and losing it off the top mid-list is how a box ends up unnamed. -->
    <div class="flow-picker-head" id="flowPickerHead"></div>
    <div class="flow-picker-body leaf-scroll" id="flowPickerBody"></div>
  </aside>
</aside>
<!-- The front-end, over the asset protocol rather than inline: the page is handed
     to WebView2 as one string with a ceiling on it and this was 88% of it. A plain
     script tag, not a module, because the fragments are written as one shared
     scope. -->
<script src="{{APP_SCRIPT_URL}}"></script>
</body>
</html>
