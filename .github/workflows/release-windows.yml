name: Release Windows Distributions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DIST_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  windows:
    name: Build Windows Distributions
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-

      - name: Install cargo-wix
        shell: pwsh
        run: cargo install cargo-wix --locked

      - name: Build distributions
        shell: pwsh
        run: ./scripts/build-windows-release.ps1 -Tag "$env:DIST_TAG"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:DIST_TAG
          # Two files, both installers a person can run and both of which the
          # in-app updater installs: the MSI, and the EXE for a machine whose
          # policy blocks Windows Installer packages. Nothing here is published
          # for the updater alone.
          # No version in either name, so the landing page's buttons can point at a fixed releases/latest/download address that keeps answering.
          $assets = @(
            "dist/leaftext-windows-x86_64.msi",
            "dist/leaftext-windows-x86_64.exe"
          )
          # Every one of them, not whichever turned up: a release missing the EXE
          # looks exactly like a release that never had one, and the machine it
          # is for is the machine nobody here can test on.
          $missing = @($assets | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw "Not built: $($missing -join ', ')" }

          # Making the release and uploading to it are retried together, over about five minutes in widening steps. Either half can be the one GitHub refuses and the second is worthless without the first, so a loop around the upload alone is refused every attempt for a release nobody made. Asking once is what cost v1.15.6, which built both installers, was refused its release, and published nothing.
          $waits = @(15, 30, 60, 90, 120)
          # A refused gh has to reach the retry rather than end the step, whatever the runner's native-error settings are that day.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          $published = $false
          for ($attempt = 0; $attempt -le $waits.Count; $attempt++) {
            & gh release view $tag *> $null
            if ($LASTEXITCODE -ne 0) {
              # A release the macOS job made in between fails here and uploads fine below, which is what happens on every release.
              & gh release create $tag --title $tag --generate-notes --verify-tag
            }
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -eq 0) { $published = $true; break }
            if ($attempt -eq $waits.Count) { break }
            Write-Host "GitHub would not publish $tag; asking again in $($waits[$attempt])s."
            Start-Sleep -Seconds $waits[$attempt]
          }
          if (-not $published) {
            # The one sentence that stops the next person spending a version number: everything but this step survived, and the tag is still up.
            throw "GitHub would not publish $tag after $($waits.Count + 1) attempts over about five minutes. The tag is on GitHub and both installers built, so finish this release on that tag rather than with a new version number: just publish-release $($tag.TrimStart('v'))"
          }

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Housekeeping after publishing, so nothing here may fail the build: the
          # macOS job races this one, and --cleanup-tag 422s on a tag the winner
          # already deleted. That turned a finished release red.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          # Two releases stand at a time: this one and the one before it. Every download address and the updater resolve through the latest release, so a repository holding only the newest has nothing complete to serve while the next release builds. The list comes back newest first, so the one to keep is the first entry that is not this job's own — the other job may already have put this tag at the top.
          $current = $env:DIST_TAG
          $others = @(gh release list --limit 100 --order desc --json tagName |
            ConvertFrom-Json |
            ForEach-Object { $_.tagName } |
            Where-Object { $_ -ne $current })
          $previous = if ($others.Count) { $others[0] } else { $null }
          $stale = @($others | Where-Object { $_ -ne $previous })

          if ($stale) {
            foreach ($old in $stale) {
              & gh release delete $old --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) {
                Write-Host "Could not remove $old with its tag; deleting the release alone."
                & gh release delete $old --yes
                if ($LASTEXITCODE -ne 0) { Write-Host "Left $old in place." }
              }
            }
          }
          exit 0
