name: Release macOS Distributions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  actions: write
  contents: write

env:
  CARGO_TERM_COLOR: always
  DIST_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  macos:
    name: Build macOS Distributions
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}

      - name: Verify runner tools
        shell: bash
        run: |
          set -euo pipefail

          echo "PATH=$PATH"
          uname -a
          sw_vers

          git --version
          python3 --version
          gh --version
          rustc --version || true
          cargo --version || true

          command -v lipo
          command -v hdiutil
          test -x /usr/libexec/PlistBuddy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          cargo build --release --locked --bins --target aarch64-apple-darwin
          cargo build --release --locked --bins --target x86_64-apple-darwin

      - name: Package distributions
        shell: bash
        run: |
          set -euo pipefail

          tag="${DIST_TAG}"
          version="${tag#v}"
          app_name="leaftext.app"

          mkdir -p dist

          python3 <<'PY' > "$RUNNER_TEMP/bin-targets.txt"
          import json
          import subprocess

          # The app by name. `--no-deps` returns no resolve graph, so there is no root to ask for, and the browser package sorts ahead of the app — taking the first member shipped a release that found no binary to package.
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          packages = metadata.get("packages", [])
          package = next((item for item in packages if item.get("name") == "leaftext"), None)
          if package is None:
              raise SystemExit("Could not resolve Cargo package metadata")

          bins = []
          for target in package.get("targets", []):
              if "bin" in target.get("kind", []):
                  bins.append(target["name"])
          if not bins:
              raise SystemExit("Release requires at least one Cargo binary target")
          print("\n".join(sorted(set(bins))))
          PY

          main_binary=""
          while IFS= read -r binary; do
            if [ -z "${main_binary}" ] || [ "${binary}" = "leaftext" ]; then
              main_binary="${binary}"
            fi
          done < "$RUNNER_TEMP/bin-targets.txt"

          if [ -z "${main_binary}" ]; then
            echo "Release requires at least one Cargo binary target" >&2
            exit 1
          fi

          arm64_binary="target/aarch64-apple-darwin/release/${main_binary}"
          x64_binary="target/x86_64-apple-darwin/release/${main_binary}"
          universal_binary="dist/${main_binary}-universal"

          test -x "${arm64_binary}"
          test -x "${x64_binary}"

          lipo -create \
            "${arm64_binary}" \
            "${x64_binary}" \
            -output "${universal_binary}"

          lipo "${universal_binary}" -verify_arch arm64 x86_64
          lipo -info "${universal_binary}"

          package_distribution() {
            local artifact_suffix="$1"
            local source_binary="$2"

            # No version in the name: the landing page's button points at a fixed releases/latest/download address, which only answers when the asset name never moves.
            local package_name="leaftext-macos-${artifact_suffix}"
            local package_dir="dist/package/${package_name}"
            local app_dir="${package_dir}/${app_name}"
            local app_contents="${app_dir}/Contents"
            local app_macos="${app_contents}/MacOS"
            local app_resources="${app_contents}/Resources"
            local dmg_root="dist/dmg-${artifact_suffix}"
            local dmg_path="dist/leaftext-macos-${artifact_suffix}.dmg"

            rm -rf "${package_dir}" "${dmg_root}"
            mkdir -p "${app_macos}" "${app_resources}" "${dmg_root}"

            cp "${source_binary}" "${app_macos}/leaftext"
            chmod +x "${app_macos}/leaftext"

            cat > "${app_contents}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Leaftext</string>
            <key>CFBundleExecutable</key>
            <string>leaftext</string>
            <key>CFBundleIdentifier</key>
            <string>com.ryanallen.leaftext</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Leaftext</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <!-- Three paths reach one of these folders with no open dialog in
                 front of them, which is why the keys are here: the pane
                 browsing down from the drive root, a saved tab's path checked
                 at launch, and a vault read whole for search. The second
                 sentence names that vault, because reading a whole folder is
                 the fact the reader is actually deciding about.
                 `macos_folder_asks_say_what_the_app_does` pins all five. -->
            <key>NSDesktopFolderUsageDescription</key>
            <string>Leaftext reads the documents you open or browse to in your Desktop folder. A folder there that you add as a vault is read in full, so search and the map of links can work.</string>
            <key>NSDocumentsFolderUsageDescription</key>
            <string>Leaftext reads the documents you open or browse to in your Documents folder. A folder there that you add as a vault is read in full, so search and the map of links can work.</string>
            <key>NSDownloadsFolderUsageDescription</key>
            <string>Leaftext reads the documents you open or browse to in your Downloads folder. A folder there that you add as a vault is read in full, so search and the map of links can work.</string>
            <key>NSRemovableVolumesUsageDescription</key>
            <string>Leaftext reads the documents you open or browse to on a connected drive. A folder there that you add as a vault is read in full, so search and the map of links can work.</string>
            <key>NSNetworkVolumesUsageDescription</key>
            <string>Leaftext reads the documents you open or browse to on a network volume. A folder there that you add as a vault is read in full, so search and the map of links can work.</string>
            <!-- Without this the bundle claims no documents: Finder shows a blank
                 icon for .md files, leaftext is absent from Open With, and Get
                 Info offers no way to make it the default. Viewer, not Editor:
                 macOS reserves Editor for apps that own saving the format.
                 Every format src/format.rs reads is claimed here;
                 `installer_claims_every_readable_extension` pins the two lists.
                 Every entry claiming extensions names Leaf too, the icon the
                 packaging step below builds: an entry with no icon of its own
                 leaves Finder a blank page whoever the default handler is, so
                 CFBundleIconFile on the app never reaches its documents.
                 Default rank so Launch Services hands an unclaimed type over on
                 its own — a choice the user made, or an app owning the format,
                 still wins. public.plain-text stays Alternate in its own entry:
                 Default there would take every .txt on the machine. The
                 double-click itself arrives as an Apple Event, handled by the
                 Event::Opened arm in src/main.rs. -->
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key>
                <string>Markdown Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Default</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>md</string>
                  <string>markdown</string>
                  <string>mdown</string>
                </array>
                <key>LSItemContentTypes</key>
                <array>
                  <string>net.daringfireball.markdown</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key>
                <string>Plain Text Document</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.plain-text</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key>
                <string>XML Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Default</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>xml</string>
                </array>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.xml</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key>
                <string>JSON Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Default</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>json</string>
                </array>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.json</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key>
                <string>YAML Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Default</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>yaml</string>
                  <string>yml</string>
                </array>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.yaml</string>
                </array>
              </dict>
              <!-- Extensions only, and a Cursor rule is why this one is not in
                   the Markdown entry above: naming a UTI makes Launch Services
                   ignore the extensions beside it, and net.daringfireball.markdown
                   covers .md and .markdown, never Cursor's .mdc. Cursor
                   publishes no UTI of its own, and inventing one would claim a
                   format leaftext does not own. -->
              <dict>
                <key>CFBundleTypeName</key>
                <string>Cursor Rule</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Default</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>mdc</string>
                </array>
              </dict>
              <!-- Extensions only: naming a UTI makes Launch Services ignore
                   them, and .mht has no system UTI to name. -->
              <dict>
                <key>CFBundleTypeName</key>
                <string>Email Message</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Default</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>eml</string>
                  <string>mht</string>
                  <string>mhtml</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key>
                <string>HTML Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>html</string>
                  <string>htm</string>
                </array>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.html</string>
                </array>
              </dict>
              <!-- Extensions only, and the existing plain text entry above is
                   left exactly as it is: putting txt into that entry would
                   attach the leaf to public.plain-text, which is every .log and
                   .csv on the machine, where this claims the one spelling.
                   Alternate rank, because TextEdit owns .txt and taking it from
                   everybody who installs an update is not this app's to do. -->
              <!-- Extensions only, for the same reason as the entry below it:
                   a config file has no system content type to name, and naming
                   one would make Launch Services ignore the extension beside
                   it. Alternate, because whatever opens a machine's config
                   files today keeps them. -->
              <dict>
                <key>CFBundleTypeName</key>
                <string>INI Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>ini</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key>
                <string>Text Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>txt</string>
                </array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key>
                <string>Source Code Document</string>
                <key>CFBundleTypeIconFile</key>
                <string>Leaf</string>
                <key>CFBundleTypeRole</key>
                <string>Viewer</string>
                <key>LSHandlerRank</key>
                <string>Alternate</string>
                <key>CFBundleTypeExtensions</key>
                <array>
                  <string>ts</string>
                  <string>tsx</string>
                  <string>js</string>
                  <string>jsx</string>
                  <string>jsonc</string>
                  <string>css</string>
                  <string>scss</string>
                  <string>sh</string>
                  <string>bash</string>
                  <string>zsh</string>
                  <string>toml</string>
                  <string>rs</string>
                  <string>py</string>
                  <string>sql</string>
                  <string>diff</string>
                  <string>patch</string>
                  <string>env</string>
                  <string>graphql</string>
                  <string>gql</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

            # Build the app icon from the PNG source. macOS runners ship sips +
            # iconutil, so we generate the full .icns at package time rather than
            # committing a binary; swapping in a larger source PNG re-crisps every
            # size automatically. A prebuilt assets/Leaf.icns, if present, wins.
            icon_source="assets/leaf-icon.png"
            if [ -f "assets/Leaf.icns" ]; then
              cp "assets/Leaf.icns" "${app_resources}/Leaf.icns"
              /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string Leaf" "${app_contents}/Info.plist"
            elif [ -f "${icon_source}" ]; then
              iconset="${RUNNER_TEMP}/Leaf.iconset"
              rm -rf "${iconset}"
              mkdir -p "${iconset}"
              for spec in \
                "16:icon_16x16" "32:icon_16x16@2x" \
                "32:icon_32x32" "64:icon_32x32@2x" \
                "128:icon_128x128" "256:icon_128x128@2x" \
                "256:icon_256x256" "512:icon_256x256@2x" \
                "512:icon_512x512" "1024:icon_512x512@2x"; do
                px="${spec%%:*}"
                name="${spec##*:}"
                sips -z "${px}" "${px}" "${icon_source}" --out "${iconset}/${name}.png" >/dev/null
              done
              iconutil -c icns "${iconset}" -o "${app_resources}/Leaf.icns"
              test -f "${app_resources}/Leaf.icns"
              /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string Leaf" "${app_contents}/Info.plist"
            fi

            test -d "${app_contents}"
            test -x "${app_macos}/leaftext"
            test -f "${app_contents}/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "${app_contents}/Info.plist" | grep -qx "leaftext"
            /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "${app_contents}/Info.plist" | grep -qx "APPL"

            # Ad-hoc sign the finished bundle (no Apple Developer ID available).
            # This gives the app a valid signature so macOS lists it cleanly under
            # Privacy & Security and accepts a Full Disk Access grant; we omit the
            # hardened runtime, which without the allow-jit entitlement would break
            # the WKWebView the reader renders in. An ad-hoc signature is not
            # notarized, so first launch still needs right-click > Open, and the
            # signature (and thus any per-folder TCC grant) changes each release,
            # so a reader is asked for a folder again after every update.
            codesign --force --sign - "${app_dir}"
            codesign --verify --verbose "${app_dir}"

            cp -R "${app_dir}" "${dmg_root}/${app_name}"
            ln -s /Applications "${dmg_root}/Applications"

            test -d "${dmg_root}/${app_name}/Contents/MacOS"
            test -x "${dmg_root}/${app_name}/Contents/MacOS/leaftext"
            test -L "${dmg_root}/Applications"
            test "$(readlink "${dmg_root}/Applications")" = "/Applications"

            create_dmg() {
              local attempt
              for attempt in 1 2 3 4 5; do
                rm -f "${dmg_path}"
                if hdiutil create -volname "Leaftext ${tag}" -srcfolder "${dmg_root}" -ov -format UDZO "${dmg_path}"; then
                  return 0
                fi
                if [ "${attempt}" = "5" ]; then
                  return 1
                fi
                echo "hdiutil create failed on attempt ${attempt}; retrying after filesystem cleanup" >&2
                sync
                sleep 5
              done
            }
            create_dmg

            mount_dir="$(mktemp -d)"
            hdiutil attach "${dmg_path}" -mountpoint "${mount_dir}" -nobrowse -readonly

            test -d "${mount_dir}/${app_name}"
            test -x "${mount_dir}/${app_name}/Contents/MacOS/leaftext"
            test -f "${mount_dir}/${app_name}/Contents/Info.plist"
            test -L "${mount_dir}/Applications"
            test "$(readlink "${mount_dir}/Applications")" = "/Applications"

            hdiutil detach "${mount_dir}" >/dev/null
            rmdir "${mount_dir}"
          }

          # One file for macOS: the universal DMG. It is what a person downloads
          # and what the in-app updater installs from, so there is nothing else to
          # publish and nothing on the release page to explain.
          package_distribution "universal" "${universal_binary}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${DIST_TAG}"
          assets=(
            "dist/leaftext-macos-universal.dmg"
          )

          # Making the release and uploading to it are retried together, over about five minutes in widening steps. Either half can be the one GitHub refuses and the second is worthless without the first, so a loop around the upload alone is refused every attempt for a release nobody made: on 17 August 2026 this one printed "release not found" four times and then failed.
          waits=(15 30 60 90 120)
          published=""
          for attempt in $(seq 0 "${#waits[@]}"); do
            # A release the Windows job made in between fails here and uploads fine below, which is what happens on every release.
            gh release view "${tag}" >/dev/null 2>&1 \
              || gh release create "${tag}" --title "${tag}" --generate-notes --verify-tag \
              || true
            if gh release upload "${tag}" "${assets[@]}" --clobber; then
              published="yes"
              break
            fi
            if [ "${attempt}" -eq "${#waits[@]}" ]; then
              break
            fi
            echo "GitHub would not publish ${tag}; asking again in ${waits[attempt]}s" >&2
            sleep "${waits[attempt]}"
          done

          if [ -z "${published}" ]; then
            # The one sentence that stops the next person spending a version number: everything but this step survived, and the tag is still up.
            echo "GitHub would not publish ${tag} after $((${#waits[@]} + 1)) attempts over about five minutes." >&2
            echo "The tag is on GitHub and both installers built, so finish this release on that tag rather than with a new version number: just publish-release ${tag#v}" >&2
            exit 1
          fi

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Two releases stand at a time: this one and the one before it. Every download address and the updater resolve through the latest release, so a repository holding only the newest has nothing complete to serve while the next release builds. The list comes back newest first, so the one to keep is the first entry that is not this job's own — the other job may already have put this tag at the top.
          current="${DIST_TAG}"
          others=$(gh release list --limit 100 --order desc --json tagName --jq '.[].tagName' | grep -v "^${current}$")
          previous=$(printf '%s\n' "${others}" | head -n 1)
          printf '%s\n' "${others}" | while IFS= read -r old; do
            if [ -n "${old}" ] && [ "${old}" != "${previous}" ]; then
              gh release delete "${old}" --yes --cleanup-tag || true
            fi
          done
