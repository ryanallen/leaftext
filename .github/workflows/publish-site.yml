name: Publish the site

# leaftext.com, with the app's own renderer built and served beside its pages.
#
# The site used to publish itself: GitHub Pages served this branch as it stood,
# so a file the pages fetched was a file somebody had committed. That is what
# this replaces. The module is 2.7 MB and the stylesheet is generated, and
# neither belongs in a tree whose whole point is small files a person can read —
# so `.gitignore` refuses them and this workflow builds them at publish time.
#
# The pictures go the same way. The repository keeps 61 PNG masters, because
# the screenshot tool, the shot composer, the edge check and the app's own three
# hand-written PNG codecs all read them; the publish writes a lossless WebP
# beside each one and moves the pages onto it, so a reader is served 3,318 KB
# where 5,336 KB used to go and not a pixel of it changes.
#
# A failure here leaves the last successful deployment standing: the site stops
# updating rather than going dark, and nothing a reader touches waits on this
# build. `scripts/site-assets.mjs` asks the module to render before it writes
# anything, so a build that produced nothing worth serving stops the run before
# the upload rather than replacing the pages with ones that cannot draw.
#
# Emptyguru rides on the result. It has no Rust and no app source, so its pages
# fetch these same files across origins — which is why the paths are a table in
# one script rather than written out here.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only what Pages needs. This workflow publishes the site; it never touches a
# release or a tag.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and a newer commit wins: a queued deployment of an
# older tree would land after the newer one and put the site back.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build the renderer and deploy the pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      # The recipe, not the script under it, so this cannot drift from what a
      # person runs on their own machine.
      #
      # Guarded because `~/.cargo/bin` is one of the cached paths above: the
      # first run to install `just` baked the binary into the cache, and every
      # run since is handed it back into the one place `cargo install` refuses
      # to overwrite. Unguarded, that refusal stops the job three steps in.
      - name: Install just
        run: command -v just || cargo install just --locked

      - name: Build the browser modules
        run: just build-web

      # The WebP an earlier run already paid for. Full effort costs two and a
      # half minutes across the set, and the key is the contents of the masters,
      # so a restored picture is always the one this run would have written and
      # a publish that changed no picture pays none of it.
      - name: Cache the converted pictures
        uses: actions/cache@v4
        with:
          path: imgs
          key: ${{ runner.os }}-webp-${{ hashFiles('imgs/**/*.png') }}

      # libwebp, installed rather than borrowed from whatever the runner image
      # happens to carry: a tool that is there today because the image ships it
      # is a tool that leaves without notice, and the failure would be the
      # site's pictures rather than a red build.
      - name: Install the picture encoder
        run: sudo apt-get install -y webp

      # The site serves 5,336 KB of paletted PNG; the same pixels as lossless
      # WebP weigh 3,318 KB, and all 61 decode back identical. The masters stay
      # PNG in the repository — this writes a WebP beside each one and moves the
      # pages onto it in the workspace the upload step below takes. It refuses
      # to move a page onto a picture nobody wrote, which is what stops a broken
      # frame reaching the deploy.
      #
      # Ahead of the bake below on purpose: the front page's document is the
      # README, and it draws 25 of these pictures. Baked first, the one page
      # every visitor lands on would go on serving the PNGs while every page
      # behind it served the WebP.
      - name: Write the pictures as WebP and move the pages onto them
        run: node scripts/site-images.mjs --write

      # The one table of what the site serves beside its pages, and the step
      # that writes the front page's own document into it, so a cold visitor
      # reads the words out of the first response. It refuses to write a module
      # that does not render or a front page baked with nothing in it, which is
      # what stops a broken build reaching the deploy step below.
      - name: Write the renderer beside the pages and bake the front page
        run: node scripts/site-assets.mjs --write

      # Everything the build left behind. The pages fetch the copies written
      # above; the raw build output is 11 MB of wasm nobody asks for.
      - name: Drop the build output
        run: rm -rf web/dist target

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
