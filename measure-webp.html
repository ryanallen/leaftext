const QS = [0, 0.9, 0.82, 0.75];
function load(src) {
  return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error(src)); i.src = src; });
}
(async () => {
  const lines = [];
  const out = document.getElementById('out');
  for (const f of FILES) {
    let img;
    try { img = await load(f.p); } catch (e) { lines.push(f.p + '\tERROR'); continue; }
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    const row = [f.p, f.n, img.naturalWidth + 'x' + img.naturalHeight];
    for (const q of QS) {
      let u;
      try { u = q === 0 ? c.toDataURL('image/webp') : c.toDataURL('image/webp', q); } catch (e) { row.push('ERR'); continue; }
      if (u.indexOf('data:image/webp') !== 0) { row.push('NOTWEBP'); continue; }
      const b64 = u.slice(u.indexOf(',') + 1);
      let n = Math.floor(b64.length * 3 / 4);
      if (b64.slice(-2) === '==') n -= 2; else if (b64.slice(-1) === '=') n -= 1;
      row.push(n);
    }
    lines.push(row.join('\t'));
    c.width = 0; c.height = 0;
    out.textContent = lines.join('\n');
  }
  out.textContent = lines.join('\n') + '\nDONE';
})();
