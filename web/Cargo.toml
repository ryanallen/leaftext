[package]
name = "leaftext-web"
version = "0.1.483"
edition = "2021"

# A browser loads a module, not a Rust library, so this is the one place the core is built as one.
[lib]
crate-type = ["cdylib"]

[features]
# The core a page downloads first: no highlighter, because most documents have no code in them. Building this package with `--features highlight` produces the second module, which a page fetches only for a document that turns out to have a fence.
default = []
highlight = ["leaftext/web"]
# The whole app in a browser rather than a document embedded in someone else's page: its page, its front end, its boot state. Half a megabyte of front end that an embedding product has no use for, which is why it is not in the core.
shell = ["highlight"]

[dependencies]
# The same renderer the desktop runs, with the window, the file dialog and SQLite left out. No second implementation, which is the whole point of this package.
leaftext = { path = "..", default-features = false }
serde_json = "1.0.150"
