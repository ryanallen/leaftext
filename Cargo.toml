[package]
name = "leaftext"
version = "1.37.0"
edition = "2021"

# The window, the web view, the file dialog, the watcher and SQLite are the desktop's, and none of them builds for a browser. They are optional so the library alone — the renderer, the format table, the editor's maps and the host boundary — compiles for `wasm32`, which is what a browser core is. The binary asks for them by name, so a plain `cargo build` is unchanged.
[features]
default = ["desktop"]
desktop = [
    "dep:tao",
    "dep:wry",
    "dep:rfd",
    "dep:rusqlite",
    "dep:notify-debouncer-mini",
    "highlight",
    "syntect/regex-onig",
    "two-face/syntect-onig",
]
# Coloring code. Optional because the syntax dumps and the regex engine are four fifths of a browser module, and most documents have no code in them — so a browser core ships without it and fetches it only for a document that turns out to have a fence. A fence renders as plain text without it, never as an error.
highlight = ["dep:syntect", "dep:two-face"]
# The same highlighter over a regex engine written in Rust. The desktop's is oniguruma, a C library with no wasm build.
web = ["highlight", "syntect/regex-fancy", "two-face/syntect-fancy"]

[[bin]]
name = "leaftext"
path = "src/main.rs"
required-features = ["desktop"]

# The browser package. It is a member rather than a folder because a browser loads a module and the desktop links a library, and only one of the two can be a crate's output at a time. The Windows installer is a member for the same shape of reason: it is a second kind of output, and it must not link the app.
[workspace]
members = ["web", "installer"]

# A compiler warning fails the build. It lives here rather than in a gate recipe because every tool reads the manifest — the four ways the gate compiles the tree, the analyzer at the line, the release builds — while a recipe switch reaches only the recipe it is written into. Cargo caps lints in dependencies to `allow`, so only this repo's own code is held to it.
[workspace.lints.rust]
warnings = "deny"

[lints]
workspace = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The module a page downloads, so size is the thing to optimize rather than speed. The desktop keeps its own settings above.
[profile.release.package.leaftext-web]
opt-level = "z"

# Parsing, sanitizing and highlighting all happen inside crates, so an unoptimized
# debug build lies about performance — 3.0s to open a 4MB glossary against 0.5s
# shipped. Dependencies change rarely, so this costs one build and keeps `cargo run`
# honest; rebuilds of this crate stay at debug speed.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
ammonia = "4.1.2"
blake3 = "1"
# Deflate for the PNG encoder in src/png.rs. Already in the tree — syntect
# builds on it — so this is a line, not a new crate.
flate2 = "1"
html-escape = "0.2.13"
# The byte skip in vault search's case-insensitive scan. Already in the tree —
# linkify, pulldown-cmark and serde_json all build on it — so this is a line, not
# a new crate.
memchr = "2"
linkify = "0.11.0"
notify-debouncer-mini = { version = "0.4", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
    "html",
] }
# Reads .eml MIME messages: multipart trees, base64/quoted-printable bodies,
# encoded-word headers. `full_encoding` brings encoding_rs for the legacy
# multibyte charsets real mail still arrives in.
mail-parser = { version = "0.11", default-features = false, features = [
    "full_encoding",
] }
rfd = { version = "0.17.2", optional = true }
roxmltree = "0.20"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Only the highlighter and its syntax set are used, and the syntaxes come from
# two-face's binary dumps. Default features would add syntect's own bundled
# syntax/theme dumps and `yaml-load`, whose `.sublime-syntax` reader is the sole
# reason the unmaintained yaml-rust was ever in the tree. two-face already asks
# for `dump-load`/`parsing` only, so switching these off drops it for good.
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "html",
], optional = true }
tao = { version = "0.35.3", optional = true }
# Tells a real date in a note's fields from text shaped like one. Already in the
# tree — wry builds on it through cookie, with `parsing` and `macros` already
# switched on — so this is a line, not a new crate and not a new feature.
time = { version = "0.3.47", default-features = false, features = [
    "parsing",
    "macros",
] }
two-face = { version = "0.5.1", default-features = false, optional = true }
url = "2.5.8"
# `transparent` is the only way a Mac web view stops painting its own background, so the shadow band shows what is behind the window rather than a gray slab. The code it gates is inside a macOS block; Windows transparency carries no gate.
wry = { version = "0.55.1", optional = true, features = ["transparent"] }
# The one YAML parser in the binary: reads the documents the app opens, and is
# maintained and fuzzed, which the input it is pointed at requires. `encoding`
# is off because files arrive as Rust strings already decoded.
yaml-rust2 = { version = "0.11.0", default-features = false }

# The window icon is decoded only where tao needs one handed to it. Windows
# takes its icon from the executable's embedded resource instead, so the PNG
# decoder is not part of that build at all.
[target.'cfg(not(windows))'.dependencies]
png = "0.17.16"

# Writing the open page out as a PDF on a Mac: the web view's own print
# operation with both panels switched off, the paper sized to the document and
# the chosen path set as where the job saves to. Every one of these already
# compiles into this binary through `wry`, at these versions and with these
# features already switched on — `objc2-web-kit` asks `objc2-app-kit` for
# `NSPrintInfo` and `NSPrintOperation` itself — so naming them adds no code to
# the tree and no feature to it either. What it buys is the name to call those
# methods by. `wry` re-exports none of them, and the only alternative it does
# offer is the print panel the reader refused.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSPrintInfo",
    "NSPrintOperation",
    # Photographing the view: a snapshot arrives as an `NSImage`, and this is what turns one into the PNG bytes the Windows side hands the page too.
    "NSBitmapImageRep",
    "NSBox",
    "NSColor",
    "NSImage",
    "NSImageRep",
] }
# The other half of that photograph: `takeSnapshotWithConfiguration:` on the `WKWebView` `wry` hands back, and the object that says how to take it. Both already compile into this binary through `wry`, at this version, so naming them adds no code and no feature — what it buys is the name to call the method by. `block2` is how its answer comes back, and it is in the tree for the same reason.
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "WKWebView",
    "WKPDFConfiguration",
] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSDictionary",
    "NSObject",
    "NSString",
    "NSURL",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_ApplicationInstallationAndServicing",
    # SetStdHandle, which points the journal's file at stderr. No console is
    # ever created — this build has none; it only swaps where stderr goes.
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    # The update download. Ships with Windows and uses the OS certificate store,
    # so no TLS stack is linked in for it.
    "Win32_Networking_WinHttp",
    # SHELLEXECUTEINFOW carries an HKEY field, so windows-sys gates the whole
    # struct (and ShellExecuteExW with it) behind the registry feature.
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    # A remote vault's refresh token, kept in Credential Manager rather than in
    # any file this app writes. One feature line on a crate already in the tree;
    # the alternative measured was `keyring`, which brings a second windows-sys.
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
    # ShellExecuteW's signature names SHOW_WINDOW_CMD from this module, so the
    # function is only compiled in when both features are on.
    "Win32_UI_WindowsAndMessaging",
] }
# Writing the open page out as a PDF, which is WebView2's own `PrintToPdf` and
# nothing else: it renders the page straight to a file and raises no print
# panel, which is the whole of what the reader asked for. Both crates already
# compile into this binary through `wry`, at these versions, so naming them adds
# no code to the tree — what it buys is the name to call that method by. `wry`
# re-exports neither, and the only alternative is the print panel the reader
# refused.
webview2-com = "0.38.2"
# `Win32_System_Com_StructuredStorage` is the stream a photograph of the view is written into — `CapturePreview` writes a whole PNG into one, and it is freed with the stream, because the page is what stacks the picture and nothing here writes it to a disk.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com_StructuredStorage",
] }
